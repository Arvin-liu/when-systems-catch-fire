name: release-transaction-protocol-validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ignition

concurrency:
  group: release-transaction-protocol-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: release-transaction-protocol-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release-validator requirements
        run: python3 -m pip install -r requirements-foundation.txt
      - name: Validate the effective R2 contract
        run: python3 tools/validate_release_transaction_protocol.py --check
      - name: Validate the R2 protocol tests
        run: python3 -m unittest tests.test_release_transaction_protocol -v
      - name: Validate an R3 protocol candidate when its files are present
        run: |
          if [ -f data/operations/release-transaction-protocol-r3.json ] \
            || [ -f tools/validate_release_transaction_protocol_r3.py ] \
            || [ -f tests/test_release_transaction_protocol_r3.py ]; then
            python3 tools/validate_release_transaction_protocol_r3.py --check
            python3 -m unittest tests.test_release_transaction_protocol_r3 -v
          fi
