name: release-transaction-protocol-validation

on:
  pull_request:
    paths:
      - '.github/workflows/release-transaction-protocol-validation.yml'
      - 'ignition/data/operations/release-transaction-protocol-r2.json'
      - 'ignition/data/operations/release-transaction-protocol-r3.json'
      - 'ignition/data/operations/release-transaction-recovery-state-r1.json'
      - 'ignition/schemas/operations/release-transaction-protocol-r2.schema.json'
      - 'ignition/schemas/operations/release-transaction-protocol-r3.schema.json'
      - 'ignition/tools/validate_release_transaction_protocol.py'
      - 'ignition/tools/validate_release_transaction_protocol_r3.py'
      - 'ignition/tests/test_release_transaction_protocol.py'
      - 'ignition/tests/test_release_transaction_protocol_r3.py'
      - 'ignition/docs/operations/stage-snapshot-publication.md'
      - 'ignition/data/operations/current-task-lineage-status.json'
      - 'ignition/data/operations/task-identity-model-r1.json'
      - 'ignition/data/operations/iterations/**/execution-contract*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-transaction-protocol-validation.yml'
      - 'ignition/data/operations/release-transaction-protocol-r2.json'
      - 'ignition/data/operations/release-transaction-protocol-r3.json'
      - 'ignition/data/operations/release-transaction-recovery-state-r1.json'
      - 'ignition/schemas/operations/release-transaction-protocol-r2.schema.json'
      - 'ignition/schemas/operations/release-transaction-protocol-r3.schema.json'
      - 'ignition/tools/validate_release_transaction_protocol.py'
      - 'ignition/tools/validate_release_transaction_protocol_r3.py'
      - 'ignition/tests/test_release_transaction_protocol.py'
      - 'ignition/tests/test_release_transaction_protocol_r3.py'
      - 'ignition/docs/operations/stage-snapshot-publication.md'
      - 'ignition/data/operations/current-task-lineage-status.json'
      - 'ignition/data/operations/task-identity-model-r1.json'
      - 'ignition/data/operations/iterations/**/execution-contract*.json'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ignition

jobs:
  validate:
    name: release-transaction-protocol-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release-validator requirements
        run: python3 -m pip install -r requirements-foundation.txt
      - name: Validate the effective R2 contract
        run: python3 tools/validate_release_transaction_protocol.py --check
      - name: Validate the R3 candidate without activating it
        run: python3 tools/validate_release_transaction_protocol_r3.py --check
      - name: Run preserved R2 tests and R3 candidate protocol tests
        run: python3 -m unittest tests.test_release_transaction_protocol tests.test_release_transaction_protocol_r3 -v
