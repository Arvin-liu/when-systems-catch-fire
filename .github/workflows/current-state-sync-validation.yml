name: current-state-sync-validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-current-state-sync:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current-state synchronization
        working-directory: ignition
        run: python3 tools/validate_current_state_sync.py --check
      - name: Validate Reference Executor freeze and build-versus-integrate fixtures
        working-directory: ignition
        run: python3 tools/validate_federation_ownership.py --check-fixtures --scan-git-diff
