name: foundation-validation
on:
  pull_request:
    paths:
      - '.github/workflows/foundation-validation.yml'
      - 'requirements-foundation.txt'
      - 'formal/lean/**'
      - 'tools/foundation/**'
      - 'tests/foundation/**'
      - 'data/foundation/**'
      - 'data/foundation-architecture/**'
      - 'data/math-foundation/**'
      - 'data/pending_claims.json'
      - 'views/**'
      - 'schemas/foundation/**'
      - 'schemas/operations/**'
      - 'schemas/architecture/**'
      - 'reports/foundation-architecture/**'
      - 'reports/operations/**'
      - 'data/operations/**'
      - 'data/architecture/**'
      - 'tools/operations/**'
      - 'tools/generate_interactive_system_map.py'
      - 'tests/test_change_propagation.py'
      - 'tools/validate_iteration_sync.py'
      - 'tests/test_iteration_sync.py'
      - 'tools/validate_human_front_door.py'
      - 'tests/test_human_front_door.py'
      - 'tests/test_pages_deploy_gate.py'
      - '.github/workflows/pages.yml'
      - 'docs/ai-assistant-usage-reference.md'
      - 'ITERATION.md'
      - 'README.md'
      - 'docs/project-current-state.md'
      - 'AI-HANDOFF.md'
      - 'AI-START-HERE.md'
      - 'llms.txt'
      - 'SUMMARY.md'
      - 'CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/foundation-validation.yml'
      - 'requirements-foundation.txt'
      - 'formal/lean/**'
      - 'tools/foundation/**'
      - 'tests/foundation/**'
      - 'data/foundation/**'
      - 'data/foundation-architecture/**'
      - 'data/math-foundation/**'
      - 'data/pending_claims.json'
      - 'views/**'
      - 'schemas/foundation/**'
      - 'schemas/operations/**'
      - 'schemas/architecture/**'
      - 'reports/foundation-architecture/**'
      - 'reports/operations/**'
      - 'data/operations/**'
      - 'data/architecture/**'
      - 'tools/operations/**'
      - 'tools/generate_interactive_system_map.py'
      - 'tests/test_change_propagation.py'
      - 'tools/validate_iteration_sync.py'
      - 'tests/test_iteration_sync.py'
      - 'tools/validate_human_front_door.py'
      - 'tests/test_human_front_door.py'
      - 'tests/test_pages_deploy_gate.py'
      - '.github/workflows/pages.yml'
      - 'docs/ai-assistant-usage-reference.md'
      - 'ITERATION.md'
      - 'README.md'
      - 'docs/project-current-state.md'
      - 'AI-HANDOFF.md'
      - 'AI-START-HERE.md'
      - 'llms.txt'
      - 'SUMMARY.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
concurrency:
  group: foundation-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-foundation.txt
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          lake-package-directory: formal/lean
          use-mathlib-cache: false
          use-github-cache: false
      - run: cd formal/lean && lake env lean Foundation.lean
      - run: python3 tools/foundation/adjudicate_core.py --check
      - run: python3 tools/foundation/migrate_legacy.py --check
      - run: python3 tools/foundation/validate_foundation.py
      - run: python3 tools/foundation/verify_core_claims.py --check
      - run: python3 tools/foundation/verify_079.py --check
      - run: python3 tools/foundation/validate_080_adjudications.py
      - name: Validate synchronization registry and iteration closures
        run: python3 tools/validate_iteration_sync.py
      - name: Validate typed change-propagation products
        run: |
          python3 tools/operations/compute_change_propagation.py \
            --request data/operations/propagation/121Q32-request.json \
            --output data/operations/propagation/121Q32-closure.json \
            --report reports/operations/121Q32-change-propagation-impact.md \
            --map-delta data/operations/propagation/121Q32-system-map-delta.json \
            --residue data/operations/propagation/121Q32-residue.json \
            --check
          python3 tools/operations/compute_change_propagation.py \
            --request data/operations/propagation/121Q32I-request.json \
            --output data/operations/propagation/121Q32I-closure.json \
            --report reports/operations/121Q32I-change-propagation-impact.md \
            --map-delta data/operations/propagation/121Q32I-system-map-delta.json \
            --residue data/operations/propagation/121Q32I-residue.json \
            --check
      - name: Validate Q32I Phase E candidate
        run: python3 tools/operations/validate_phase_e_candidate.py --check
      - name: Validate registry-derived system map
        run: python3 tools/generate_interactive_system_map.py --check
      - run: python3 tools/validate_human_front_door.py
      - run: python3 -m unittest tests.foundation.test_foundation
      - run: python3 -m unittest tests.test_iteration_sync -v
      - run: python3 -m unittest tests.test_human_front_door -v
      - run: python3 -m unittest tests.test_change_propagation -v
      - run: python3 -m unittest tests.test_pages_deploy_gate -v
      - run: python3 -m unittest tests.test_phase_e_candidate -v
