name: foundation-validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: foundation-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-foundation.txt
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          lake-package-directory: formal/lean
          use-mathlib-cache: false
          use-github-cache: false
      - run: cd formal/lean && lake env lean Foundation.lean
      - run: python3 tools/foundation/adjudicate_core.py --check
      - run: python3 tools/foundation/migrate_legacy.py --check
      - run: python3 tools/foundation/validate_foundation.py
      - run: python3 tools/foundation/build_function_asset_census.py --check
      - run: python3 tools/foundation/adjudicate_function_assets.py --check
      - run: python3 tools/foundation/validate_claim_governance.py
      - run: python3 tools/foundation/validate_function_asset_closure.py
      - run: python3 tools/foundation/run_function_asset_math_checks.py --check
      - run: python3 tools/foundation/adjudicate_nonfunction_claims.py --check
      - run: python3 tools/foundation/validate_nonfunction_claim_closure.py
      - name: Validate human result census and self-correction products
        run: |
          python3 tools/governance/build_human_results.py --check
          python3 tools/governance/run_self_correction.py --check
          python3 tools/governance/build_knowledge_experience.py --check
          python3 tools/governance/validate_human_visibility.py
          python3 tools/governance/validate_knowledge_experience.py
      - name: Regression — knowledge-experience clone-independence (task 102)
        run: python3 tools/governance/check_knowledge_experience_determinism.py
      - run: python3 tools/foundation/verify_core_claims.py --check
      - run: python3 tools/foundation/verify_079.py --check
      - run: python3 tools/foundation/validate_080_adjudications.py
      - name: Validate synchronization registry and iteration closures
        run: python3 tools/validate_iteration_sync.py
      - name: Validate typed change-propagation products
        run: |
          # Q32 is accepted historical evidence and is verified by the D4
          # closeout validator; do not reinterpret its map delta against the
          # later Q32I candidate registry.
          # Q32I is validated era-aware (V15 Q32I-B): recompute its closure and
          # delta against the registry/topology/surfaces snapshot at its merge
          # commit, not the live (since-drifted) registry.
          python3 tools/operations/validate_phase_d_closeout.py --check
          python3 tools/operations/compute_change_propagation.py \
            --request data/operations/propagation/121Q32I-request.json \
            --output data/operations/propagation/121Q32I-closure.json \
            --report reports/operations/121Q32I-change-propagation-impact.md \
            --map-delta data/operations/propagation/121Q32I-system-map-delta.json \
            --residue data/operations/propagation/121Q32I-residue.json \
            --era-ref 0a13c246172c0338bf8dda5dc08db5a574a8b23f \
            --check
          # The three method-1.4 products below were jointly regenerated and
          # sealed at f59b9f35. Validate their inputs and map at that era so a
          # later governed surface retirement does not rewrite closed evidence.
          python3 tools/operations/compute_change_propagation.py \
            --request data/operations/propagation/IGNITION-ITERATION-METHOD-1.4-CONTINUOUS-STAGE-SNAPSHOT-PUBLICATION-R1-20260726-request.json \
            --output data/operations/propagation/IGNITION-ITERATION-METHOD-1.4-CONTINUOUS-STAGE-SNAPSHOT-PUBLICATION-R1-20260726-closure.json \
            --report reports/operations/IGNITION-ITERATION-METHOD-1.4-change-propagation-impact.md \
            --map-delta data/operations/propagation/IGNITION-ITERATION-METHOD-1.4-CONTINUOUS-STAGE-SNAPSHOT-PUBLICATION-R1-20260726-system-map-delta.json \
            --residue data/operations/propagation/IGNITION-ITERATION-METHOD-1.4-CONTINUOUS-STAGE-SNAPSHOT-PUBLICATION-R1-20260726-residue.json \
            --era-ref f59b9f359ea16a346e07e9621049468417b66423 \
            --head-ref f59b9f359ea16a346e07e9621049468417b66423 \
            --check
          python3 tools/operations/compute_change_propagation.py \
            --request data/operations/propagation/IGNITION-ITERATION-METHOD-1.4-RESPONSIBILITY-ACTOR-GATE-NARROW-REPAIR-R1-20260726-request.json \
            --output data/operations/propagation/IGNITION-ITERATION-METHOD-1.4-RESPONSIBILITY-ACTOR-GATE-NARROW-REPAIR-R1-20260726-closure.json \
            --report reports/operations/IGNITION-ITERATION-METHOD-1.4-RESPONSIBILITY-ACTOR-GATE-NARROW-REPAIR-R1-20260726-change-propagation-impact.md \
            --map-delta data/operations/propagation/IGNITION-ITERATION-METHOD-1.4-RESPONSIBILITY-ACTOR-GATE-NARROW-REPAIR-R1-20260726-system-map-delta.json \
            --residue data/operations/propagation/IGNITION-ITERATION-METHOD-1.4-RESPONSIBILITY-ACTOR-GATE-NARROW-REPAIR-R1-20260726-residue.json \
            --era-ref f59b9f359ea16a346e07e9621049468417b66423 \
            --head-ref f59b9f359ea16a346e07e9621049468417b66423 \
            --check
          python3 tools/operations/compute_change_propagation.py \
            --request data/operations/propagation/IGNITION-ITERATION-METHOD-1.4-RESPONSIBILITY-ACTOR-NORMALIZED-SCHEMA-AND-AUTOMATION-VARIANT-NARROW-REPAIR-R2-20260726-request.json \
            --output data/operations/propagation/IGNITION-ITERATION-METHOD-1.4-RESPONSIBILITY-ACTOR-NORMALIZED-SCHEMA-AND-AUTOMATION-VARIANT-NARROW-REPAIR-R2-20260726-closure.json \
            --report reports/operations/IGNITION-ITERATION-METHOD-1.4-RESPONSIBILITY-ACTOR-NORMALIZED-SCHEMA-AND-AUTOMATION-VARIANT-NARROW-REPAIR-R2-20260726-change-propagation-impact.md \
            --map-delta data/operations/propagation/IGNITION-ITERATION-METHOD-1.4-RESPONSIBILITY-ACTOR-NORMALIZED-SCHEMA-AND-AUTOMATION-VARIANT-NARROW-REPAIR-R2-20260726-system-map-delta.json \
            --residue data/operations/propagation/IGNITION-ITERATION-METHOD-1.4-RESPONSIBILITY-ACTOR-NORMALIZED-SCHEMA-AND-AUTOMATION-VARIANT-NARROW-REPAIR-R2-20260726-residue.json \
            --era-ref f59b9f359ea16a346e07e9621049468417b66423 \
            --head-ref f59b9f359ea16a346e07e9621049468417b66423 \
            --check
      - name: Validate Q32I Phase E candidate
        run: python3 tools/operations/validate_phase_e_candidate.py --check
      - name: Validate registry-derived system map
        run: python3 tools/generate_interactive_system_map.py --check
      - name: Validate stage snapshot registry and deterministic homepage projection
        run: |
          python3 tools/operations/generate_stage_snapshot_actor_contract.py --check
          python3 tools/operations/validate_stage_snapshots.py --check
      - name: Run instance-level stage snapshot responsibility actor cases
        run: python3 tools/operations/run_stage_snapshot_responsibility_cases.py
      - run: python3 tools/validate_human_front_door.py
      - name: Validate Language-Thought Logic Plane
        run: |
          python3 tools/language_thought/validate_language_thought.py
          python3 -m unittest tests.test_language_thought_plane
      - run: python3 -m unittest tests.foundation.test_foundation
      - run: python3 -m unittest tests.foundation.test_claim_governance
      - run: python3 -m unittest tests.foundation.test_function_asset_closure
      - run: python3 -m unittest tests.foundation.test_nonfunction_claim_closure -v
      - run: python3 -m unittest tests.test_iteration_sync -v
      - run: python3 -m unittest tests.test_human_front_door -v
      - run: python3 -m unittest tests.test_change_propagation -v
      - run: python3 -m unittest tests.test_human_visibility_gate tests.test_self_correction_engine tests.test_knowledge_experience -v
      - run: python3 -m unittest tests.test_stage_snapshot_publication -v
      - run: python3 -m unittest tests.test_era_resolver_generalization tests.test_generated_output_authority -v
      - run: python3 -m unittest tests.test_phase_e_candidate -v
      - run: python3 -m unittest tests.test_production_execution_authority -v
      - name: "Task 107 — generator determinism & reconciliation staleness (Layer B negative fixtures)"
        run: python3 -m unittest tests.foundation.test_generator_reconciliation_staleness -v
      - name: "Task 106 — fail-closed propagation reconciliation"
        run: |
          python3 -m unittest tests.test_propagation_reconciliation -v
          python3 tools/propagation/validate_reconciliation.py --check
      - name: "Task 115 Round 1 — executor-neutral action/observation boundary schemas"
        run: python3 -m unittest tests.test_deep_research_round1 -v
