name: pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - data/operations/stage-snapshots.json
      - data/operations/responsibility-actors.json
      - schemas/operations/responsibility-actor-registry.schema.json
      - docs/generated/recent-stage-results.md
      - docs/operations/stage-snapshot-publication.md
      - tools/operations/stage_snapshot_contract.py
      - tools/operations/generate_stage_snapshot_actor_contract.py
      - docs/ai-assistant-usage-reference.md
      - data/architecture/interactive-system-map.json
      - data/architecture/interactive-system-map-layout.json
      - data/operations/project-components.json
      - data/operations/change-propagation-topology.json
      - data/operations/component-execution-profiles.json
      - tools/generate_interactive_system_map.py
      - .github/workflows/pages.yml
      - pages/**
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build the Pages artifact from (candidate exact HEAD). Production deploy still only runs on main.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Record exact-head provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          BUILT_SHA=$(git rev-parse HEAD)
          echo "built_sha=$BUILT_SHA" >> "$GITHUB_OUTPUT"
          echo "Built Pages artifact from sha=$BUILT_SHA"
      - uses: actions/configure-pages@v5
      - name: Build README reading site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets
          mkdir -p site/_layouts
          cp pages/_config.yml site/_config.yml
          cp pages/assets/readable.css site/assets/readable.css
          cp pages/_layouts/default.html site/_layouts/default.html
          mkdir -p site/generated
          cp pages/generated/ignition-system-map.svg site/generated/ignition-system-map.svg
          cp pages/system-map.html site/system-map.html
          mkdir -p site/docs/publication/works
          mkdir -p site/docs/publication/cases
          mkdir -p site/reports/publication
          mkdir -p site/reports/operations
          mkdir -p site/docs/architecture
          mkdir -p site/docs/generated
          mkdir -p site/docs/operations
          mkdir -p site/data/operations
          mkdir -p site/data/architecture
          cp docs/publication/zhiyuan-writing-showcase.md site/docs/publication/zhiyuan-writing-showcase.md
          cp docs/publication/zhiyuan-writing-method.md site/docs/publication/zhiyuan-writing-method.md
          cp docs/publication/works/when-an-army-believes-its-own-back.md site/docs/publication/works/when-an-army-believes-its-own-back.md
          cp docs/publication/cases/jin-rise-case-source.md site/docs/publication/cases/jin-rise-case-source.md
          cp reports/publication/jin-rise-point-fire-analysis.md site/reports/publication/jin-rise-point-fire-analysis.md
          cp docs/architecture/interactive-system-map.md site/docs/architecture/interactive-system-map.md
          cp docs/architecture/typed-change-propagation.md site/docs/architecture/typed-change-propagation.md
          cp docs/architecture/incremental-execution.md site/docs/architecture/incremental-execution.md
          cp docs/generated/recent-stage-results.md site/docs/generated/recent-stage-results.md
          cp docs/operations/stage-snapshot-publication.md site/docs/operations/stage-snapshot-publication.md
          mkdir -p site/docs/governance
          cp docs/governance/charter-system-r1.md site/docs/governance/charter-system-r1.md
          cp docs/governance/charter-system-registry.json site/docs/governance/charter-system-registry.json
          cp docs/governance/life-community-value-charter.md site/docs/governance/life-community-value-charter.md
          cp docs/USAGE.md site/docs/USAGE.md
          cp reports/operations/121Q32-change-propagation-impact.md site/reports/operations/121Q32-change-propagation-impact.md
          cp reports/operations/121Q32I-change-propagation-impact.md site/reports/operations/121Q32I-change-propagation-impact.md
          cp reports/operations/121Q32I-incremental-execution-demonstration.json site/reports/operations/121Q32I-incremental-execution-demonstration.json
          cp reports/operations/121Q32I-completion-seal.json site/reports/operations/121Q32I-completion-seal.json
          cp reports/operations/IGNITION-ITERATION-METHOD-1.4-homepage-comparison.md site/reports/operations/IGNITION-ITERATION-METHOD-1.4-homepage-comparison.md
          mkdir -p site/data/operations/iterations
          cp data/operations/iterations/121Q32I.json site/data/operations/iterations/121Q32I.json
          cp data/operations/project-components.json site/data/operations/project-components.json
          cp data/operations/change-propagation-topology.json site/data/operations/change-propagation-topology.json
          cp data/operations/component-execution-profiles.json site/data/operations/component-execution-profiles.json
          cp data/operations/stage-snapshots.json site/data/operations/stage-snapshots.json
          cp data/operations/responsibility-actors.json site/data/operations/responsibility-actors.json
          cp data/architecture/interactive-system-map-layout.json site/data/architecture/interactive-system-map-layout.json
          cp data/architecture/interactive-system-map.json site/data/architecture/interactive-system-map.json
          {
            printf '%s\n' '---'
            printf '%s\n' 'title: When Systems Catch Fire / 点火'
            printf '%s\n' 'layout: default'
            printf '%s\n' '---'
            printf '\n'
            cat README.md
          } > site/index.md
      - name: Verify generated interactive system map
        run: python3 tools/generate_interactive_system_map.py --check
      - name: Verify deterministic stage snapshot projection
        run: |
          python3 tools/operations/generate_stage_snapshot_actor_contract.py --check
          python3 tools/operations/validate_stage_snapshots.py --check
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site
      - name: Preserve repository-compatible analysis link
        shell: bash
        run: |
          sudo mkdir -p _site/reports/publication
          sudo cp reports/publication/jin-rise-point-fire-analysis.md _site/reports/publication/jin-rise-point-fire-analysis.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # PRODUCTION DEPLOY is permitted ONLY for a real `push` to `main`.
    # workflow_dispatch (whether from main, a candidate branch, or with a
    # candidate ref) must never deploy; it can only build a candidate artifact.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
