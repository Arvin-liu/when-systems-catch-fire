name: pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/foundation/claim-governance-and-function-identity.md
      - docs/foundation/historical-function-census.md
      - docs/foundation/function-asset-authoring-guide.md
      - docs/foundation/physics-asset-correction-20260729.md
      - docs/foundation/historical-correction-log.md
      - docs/foundation/function-audit-roadmap.md
      - docs/foundation/historical-function-deep-adjudication-20260729.md
      - docs/foundation/public-claim-ceiling-guidance.md
      - docs/foundation/function-asset-registry-migration-r2.md
      - data/foundation/function-assets/census-summary.json
      - data/foundation/function-assets/closure-summary.json
      - data/operations/stage-snapshots.json
      - data/operations/responsibility-actors.json
      - schemas/operations/responsibility-actor-registry.schema.json
      - docs/generated/recent-stage-results.md
      - docs/operations/stage-snapshot-publication.md
      - tools/operations/stage_snapshot_contract.py
      - tools/operations/generate_stage_snapshot_actor_contract.py
      - docs/ai-assistant-usage-reference.md
      - data/architecture/interactive-system-map.json
      - data/architecture/interactive-system-map-layout.json
      - data/operations/project-components.json
      - data/operations/change-propagation-topology.json
      - data/operations/component-execution-profiles.json
      - tools/generate_interactive_system_map.py
      - .github/workflows/pages.yml
      - pages/**
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build the Pages artifact from (candidate exact HEAD). Production deploy still only runs on main.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Record exact-head provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          BUILT_SHA=$(git rev-parse HEAD)
          echo "built_sha=$BUILT_SHA" >> "$GITHUB_OUTPUT"
          echo "Built Pages artifact from sha=$BUILT_SHA"
      - uses: actions/configure-pages@v5
      - name: Build README reading site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets
          mkdir -p site/_layouts
          cp pages/_config.yml site/_config.yml
          cp pages/assets/readable.css site/assets/readable.css
          cp pages/_layouts/default.html site/_layouts/default.html
          mkdir -p site/generated
          cp pages/generated/ignition-system-map.svg site/generated/ignition-system-map.svg
          cp pages/system-map.html site/system-map.html
          mkdir -p site/docs/publication/works
          mkdir -p site/docs/publication/cases
          mkdir -p site/reports/publication
          mkdir -p site/reports/operations
          mkdir -p site/docs/architecture
          mkdir -p site/docs/generated
          mkdir -p site/docs/operations
          mkdir -p site/data/operations
          mkdir -p site/data/architecture
          cp docs/publication/zhiyuan-writing-showcase.md site/docs/publication/zhiyuan-writing-showcase.md
          cp docs/publication/zhiyuan-writing-method.md site/docs/publication/zhiyuan-writing-method.md
          cp docs/publication/works/when-an-army-believes-its-own-back.md site/docs/publication/works/when-an-army-believes-its-own-back.md
          cp docs/publication/cases/jin-rise-case-source.md site/docs/publication/cases/jin-rise-case-source.md
          cp reports/publication/jin-rise-point-fire-analysis.md site/reports/publication/jin-rise-point-fire-analysis.md
          cp docs/architecture/interactive-system-map.md site/docs/architecture/interactive-system-map.md
          cp docs/architecture/typed-change-propagation.md site/docs/architecture/typed-change-propagation.md
          cp docs/architecture/incremental-execution.md site/docs/architecture/incremental-execution.md
          cp docs/generated/recent-stage-results.md site/docs/generated/recent-stage-results.md
          cp docs/operations/stage-snapshot-publication.md site/docs/operations/stage-snapshot-publication.md
          mkdir -p site/docs/governance
          cp docs/governance/charter-system-r1.md site/docs/governance/charter-system-r1.md
          cp docs/governance/charter-system-registry.json site/docs/governance/charter-system-registry.json
          cp docs/governance/life-community-value-charter.md site/docs/governance/life-community-value-charter.md
          cp docs/USAGE.md site/docs/USAGE.md
          cp reports/operations/121Q32-change-propagation-impact.md site/reports/operations/121Q32-change-propagation-impact.md
          cp reports/operations/121Q32I-change-propagation-impact.md site/reports/operations/121Q32I-change-propagation-impact.md
          cp reports/operations/121Q32I-incremental-execution-demonstration.json site/reports/operations/121Q32I-incremental-execution-demonstration.json
          cp reports/operations/121Q32I-completion-seal.json site/reports/operations/121Q32I-completion-seal.json
          cp reports/operations/IGNITION-ITERATION-METHOD-1.4-homepage-comparison.md site/reports/operations/IGNITION-ITERATION-METHOD-1.4-homepage-comparison.md
          mkdir -p site/data/operations/iterations
          cp data/operations/iterations/121Q32I.json site/data/operations/iterations/121Q32I.json
          cp data/operations/project-components.json site/data/operations/project-components.json
          cp data/operations/change-propagation-topology.json site/data/operations/change-propagation-topology.json
          cp data/operations/component-execution-profiles.json site/data/operations/component-execution-profiles.json
          cp data/operations/stage-snapshots.json site/data/operations/stage-snapshots.json
          cp data/operations/responsibility-actors.json site/data/operations/responsibility-actors.json
          cp data/architecture/interactive-system-map-layout.json site/data/architecture/interactive-system-map-layout.json
          cp data/architecture/interactive-system-map.json site/data/architecture/interactive-system-map.json
          # --- F5-B1 (IGNITION-PAGES-PUBLIC-DOCUMENT-LINK-F5-B1-FIX-R1-20260728) ---
          # Publish the 13 P0/P1 homepage + key foundation docs + the USAGE
          # template-spec link that README and docs/USAGE.md reference but the
          # allowlist omitted (systemic 404; audit = 1111 Draft PR #75).
          # Exact deduplicated target set = 4 P0 + 6 P1 + 2 P2 foundation JSONs + 1 template
          # (the audit's prose summary "14 cp / 4 P0 + 7 P1 + 1 template = 12" double-counted
          #  the 2 P2 foundation JSONs as P1; the authoritative set is 13 files).
          mkdir -p site/docs/foundation
          cp docs/project-current-state.md site/docs/project-current-state.md
          cp ITERATION.md site/ITERATION.md
          cp docs/ai-assistant-usage-reference.md site/docs/ai-assistant-usage-reference.md
          cp SUMMARY.md site/SUMMARY.md
          cp ARCHITECTURE.md site/ARCHITECTURE.md
          cp FOUNDATION.md site/FOUNDATION.md
          cp docs/foundation/README.md site/docs/foundation/README.md
          cp docs/foundation/claim-governance-and-function-identity.md site/docs/foundation/claim-governance-and-function-identity.md
          cp docs/foundation/historical-function-census.md site/docs/foundation/historical-function-census.md
          cp docs/foundation/function-asset-authoring-guide.md site/docs/foundation/function-asset-authoring-guide.md
          cp docs/foundation/physics-asset-correction-20260729.md site/docs/foundation/physics-asset-correction-20260729.md
          cp docs/foundation/historical-correction-log.md site/docs/foundation/historical-correction-log.md
          cp docs/foundation/function-audit-roadmap.md site/docs/foundation/function-audit-roadmap.md
          cp docs/foundation/historical-function-deep-adjudication-20260729.md site/docs/foundation/historical-function-deep-adjudication-20260729.md
          cp docs/foundation/public-claim-ceiling-guidance.md site/docs/foundation/public-claim-ceiling-guidance.md
          cp docs/foundation/function-asset-registry-migration-r2.md site/docs/foundation/function-asset-registry-migration-r2.md
          mkdir -p site/data/foundation
          cp data/foundation/project-state.json site/data/foundation/project-state.json
          cp data/foundation/registry-manifest.json site/data/foundation/registry-manifest.json
          cp data/foundation/migration-summary.json site/data/foundation/migration-summary.json
          mkdir -p site/data/foundation/function-assets
          cp data/foundation/function-assets/census-summary.json site/data/foundation/function-assets/census-summary.json
          cp data/foundation/function-assets/closure-summary.json site/data/foundation/function-assets/closure-summary.json
          mkdir -p site/function-os-candidate/v0.2
          cp function-os-candidate/v0.2/README.md site/function-os-candidate/v0.2/README.md
          cp docs/participate.md site/docs/participate.md
          mkdir -p site/templates/publication
          cp templates/publication/zhiyuan-writing-spec.md site/templates/publication/zhiyuan-writing-spec.md
          # --- F5-B2 Batch 1 (IGNITION-PAGES-PUBLIC-DOCUMENT-LINK-F5-B2-BATCH1-FIX-R1-20260728) ---
          # Publish the 7 root-level entry docs that the homepage README links to
          # but the allowlist omitted (systemic 404; audit = 1111 Draft PR #78).
          # These are repo-root files copied to site-root (no mkdir needed).
          # Recommended FIRST batch only; remaining 17 F5-B2 targets + F5-B3 deferred.
          cp AI-START-HERE.md site/AI-START-HERE.md
          cp AI-HANDOFF.md site/AI-HANDOFF.md
          cp llms.txt site/llms.txt
          cp CONTRIBUTING.md site/CONTRIBUTING.md
          cp SUPPORT.md site/SUPPORT.md
          cp COMMERCIAL-LICENSING.md site/COMMERCIAL-LICENSING.md
          cp SUSTAINABILITY.md site/SUSTAINABILITY.md
          # --- F5-B2 Batch 2 (IGNITION-PAGES-PUBLIC-DOCUMENT-LINK-F5-B2-BATCH2-FIX-R1-20260728) ---
          # Publish the 7 core reference docs under docs/ and docs/architecture/
          # that the homepage README (and published docs/USAGE.md) link to but the
          # allowlist omitted (systemic 404; audit = 1111 Draft PR #78, Batch 2).
          # site/docs and site/docs/architecture are already created by the
          # existing flow above (mkdir -p at lines 69/73) -- NO new mkdir required.
          # Remaining F5-B2 Batch 3-5 targets and F5-B3 are DEFERRED (not in this batch).
          cp docs/GET-BRAIN-WORKFLOW.md site/docs/GET-BRAIN-WORKFLOW.md
          cp docs/VERSIONING.md site/docs/VERSIONING.md
          cp docs/PROJECT-ARCHITECTURE.md site/docs/PROJECT-ARCHITECTURE.md
          cp docs/claim_levels.md site/docs/claim_levels.md
          cp docs/evidence_regime_library.md site/docs/evidence_regime_library.md
          cp docs/architecture/multiscale-causal-fabric.md site/docs/architecture/multiscale-causal-fabric.md
          cp docs/architecture/probabilistic-system-dynamics.md site/docs/architecture/probabilistic-system-dynamics.md
          # --- F5-B2 Batch 3 (architecture docs) ---
          # Publish the 2 architecture docs under docs/architecture/ that the
          # homepage README links to but the allowlist omitted (systemic 404;
          # audit = 1111 Draft PR #78, Batch 3). site/docs/architecture is
          # already created by the existing flow above (mkdir -p at line 73) --
          # NO new mkdir required. Remaining F5-B2 Batch 4-5 targets and F5-B3
          # are DEFERRED (not in this batch).
          cp docs/architecture/adaptive-relational-network.md site/docs/architecture/adaptive-relational-network.md
          cp docs/architecture/ignition-atlas.md site/docs/architecture/ignition-atlas.md
          # --- F5-B2 Batch 4 (deep docs/ subdir docs, require new site/ dirs) ---
          # Publish 6 docs that the homepage README / docs/USAGE.md link to but
          # the allowlist omitted (systemic 404; audit = 1111 Draft PR #78,
          # Batch 4). Each target lives under a site/ subdir that does not yet
          # exist, so mkdir -p is required for 4 distinct directories. Remaining
          # F5-B2 Batch 5 (Unicode 统一* indexes) is implemented below (this
          # commit); only F5-B3 remains DEFERRED (not here).
          mkdir -p site/docs/falsifiability
          mkdir -p site/case_failures
          mkdir -p site/docs/governance/meta-protocol-reviews
          mkdir -p site/docs/meta-protocols
          cp docs/falsifiability/README.md site/docs/falsifiability/README.md
          cp case_failures/README.md site/case_failures/README.md
          cp docs/governance/meta-protocol-reviews/12-meta-protocol-normative-review.md site/docs/governance/meta-protocol-reviews/12-meta-protocol-normative-review.md
          cp docs/meta-protocols/README.md site/docs/meta-protocols/README.md
          cp docs/meta-protocols/12-meta-protocols.md site/docs/meta-protocols/12-meta-protocols.md
          cp docs/meta-protocols/meta-protocol-64-combination-matrix.md site/docs/meta-protocols/meta-protocol-64-combination-matrix.md
          # --- F5-B2 Batch 5 (Unicode 统一* indexes, require new site/ dirs) ---
          # Publish the 2 Unicode INDEX.md files that the PUBLISHED SUMMARY.md
          # links to (./统一函数总表/INDEX.md and ./统一案例总表/INDEX.md) but the
          # allowlist omitted (systemic 404; audit = 1111 Draft PR #78, Batch 5;
          # this fix = 1111 Draft PR #<TBD>). Each target lives under a site/
          # subdir that does not yet exist, so mkdir -p is required for 2 distinct
          # directories. The 2 SOURCE paths are byte-identical to the Git tree
          # (NFC, no NFD drift; verified via `git ls-tree -r -z`). The Unicode
          # source/target paths are double-quoted for shell safety (prevent
          # word-splitting / escaping / locale issues). F5-B3 remains DEFERRED.
          mkdir -p "site/统一函数总表"
          mkdir -p "site/统一案例总表"
          cp "统一函数总表/INDEX.md" "site/统一函数总表/INDEX.md"
          cp "统一案例总表/INDEX.md" "site/统一案例总表/INDEX.md"
          # --- F5-B3 (IGNITION-PAGES-F5-B3-FIX-R1-20260728) ---
          # Publish the 5 residual un-published-but-existing files CONFIRMED by
          # the F5-B3 audit (1111 Draft PR #90, 30_F5B3_AUDIT.md). These are the
          # ONLY real F5-B3 residuals: LICENSE (repo root), LICENSES/README.md,
          # README.md (referenced by docs/USAGE.md), views/README.md, and
          # data/meta-protocols/README.md. Pure publish only (cp + mkdir -p); no
          # new content is created. F5-B1 and all F5-B2 batches are untouched --
          # no scope creep. No homepage link is affected by this batch.
          # NOTE: site/data/meta-protocols is NOT covered by the existing
          # site/data/operations|architecture|foundation mkdir lines, so a
          # dedicated mkdir -p is required (verified: no prior mkdir creates it).
          cp LICENSE site/LICENSE
          mkdir -p site/LICENSES
          cp LICENSES/README.md site/LICENSES/README.md
          cp README.md site/README.md
          mkdir -p site/views
          cp views/README.md site/views/README.md
          mkdir -p site/data/meta-protocols
          cp data/meta-protocols/README.md site/data/meta-protocols/README.md
          # --- Task 94 public-surface total closeout (2026-07-29) ---
          # Publish the exact 23 existing source files still linked from the
          # authoritative SUMMARY surface after F5-B1/B2/B3. This is an
          # explicit allowlist: no glob and no whole-directory copy.
          mkdir -p site/data/foundation/arguments
          mkdir -p site/data/foundation/claims
          mkdir -p site/data/foundation/evidence
          mkdir -p site/data/foundation/formal-objects
          mkdir -p site/data/foundation/mappings
          mkdir -p site/data/foundation/migrations
          mkdir -p site/data/foundation/proofs
          mkdir -p site/data/foundation/sources
          mkdir -p site/data/foundation/validations
          cp data/foundation/arguments/arguments.jsonl site/data/foundation/arguments/arguments.jsonl
          cp data/foundation/claims/claims.jsonl site/data/foundation/claims/claims.jsonl
          cp data/foundation/evidence/evidence.jsonl site/data/foundation/evidence/evidence.jsonl
          cp data/foundation/formal-objects/objects.jsonl site/data/foundation/formal-objects/objects.jsonl
          cp data/foundation/mappings/object-evidence-mappings.jsonl site/data/foundation/mappings/object-evidence-mappings.jsonl
          cp data/foundation/migrations/legacy-assets.jsonl site/data/foundation/migrations/legacy-assets.jsonl
          cp data/foundation/proofs/proof-artifacts.jsonl site/data/foundation/proofs/proof-artifacts.jsonl
          cp data/foundation/sources/sources.jsonl site/data/foundation/sources/sources.jsonl
          cp data/foundation/validations/validation-records.jsonl site/data/foundation/validations/validation-records.jsonl
          cp docs/AGENT-GUIDE.md site/docs/AGENT-GUIDE.md
          cp docs/architecture/attention-attractor-control-plane.md site/docs/architecture/attention-attractor-control-plane.md
          cp docs/architecture/compression-integrity-gate.md site/docs/architecture/compression-integrity-gate.md
          cp docs/architecture/distribution-collapse-control-plane.md site/docs/architecture/distribution-collapse-control-plane.md
          cp docs/architecture/effectual-action-plane.md site/docs/architecture/effectual-action-plane.md
          cp docs/architecture/mechanism-adjudication-plane.md site/docs/architecture/mechanism-adjudication-plane.md
          cp docs/governance/meta-protocol-reviews/cross-protocol-red-team.md site/docs/governance/meta-protocol-reviews/cross-protocol-red-team.md
          cp docs/governance/meta-protocol-reviews/factual-pending-register.md site/docs/governance/meta-protocol-reviews/factual-pending-register.md
          cp docs/meta-protocols/book-validation-22-cases-20260709.md site/docs/meta-protocols/book-validation-22-cases-20260709.md
          cp docs/meta-protocols/version-iteration-note-20260709.md site/docs/meta-protocols/version-iteration-note-20260709.md
          cp docs/phi_meta_law.md site/docs/phi_meta_law.md
          cp docs/publication/zhiyuan-writing-examples.md site/docs/publication/zhiyuan-writing-examples.md
          mkdir -p site/outputs/book-collisions/20260709-22-book-validation
          cp outputs/book-collisions/20260709-22-book-validation/book-case-candidates.md site/outputs/book-collisions/20260709-22-book-validation/book-case-candidates.md
          mkdir -p site/reports/foundation-architecture
          cp reports/foundation-architecture/core-system-reclassification-20260712.md site/reports/foundation-architecture/core-system-reclassification-20260712.md
          {
            printf '%s\n' '---'
            printf '%s\n' 'title: When Systems Catch Fire / 点火'
            printf '%s\n' 'layout: default'
            printf '%s\n' '---'
            printf '\n'
            cat README.md
          } > site/index.md
      - name: Verify generated interactive system map
        run: python3 tools/generate_interactive_system_map.py --check
      - name: Verify deterministic stage snapshot projection
        run: |
          python3 tools/operations/generate_stage_snapshot_actor_contract.py --check
          python3 tools/operations/validate_stage_snapshots.py --check
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site
      - name: Preserve repository-compatible analysis link
        shell: bash
        run: |
          sudo mkdir -p _site/reports/publication
          sudo cp reports/publication/jin-rise-point-fire-analysis.md _site/reports/publication/jin-rise-point-fire-analysis.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # PRODUCTION DEPLOY is permitted ONLY for a real `push` to `main`.
    # workflow_dispatch (whether from main, a candidate branch, or with a
    # candidate ref) must never deploy; it can only build a candidate artifact.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
