name: Task229-R4-R2.2 local provider proof

on:
  pull_request:
    paths:
      - 'ignition/evaluation/ignition-229-r4-runtime-r2-2-codex-native/**'
      - '.github/workflows/task229-r4-r2-2-local-proof.yml'
      - 'ignition/data/foundation/repository-path-classification/classification-manifest.jsonl'

permissions:
  contents: read

jobs:
  local-proof-package:
    name: Task229-R4-R2.2 local proof package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen local-only proof receipt
        run: python3 ignition/evaluation/ignition-229-r4-runtime-r2-2-codex-native/validate_local_proof.py
      - name: Verify package checksums
        working-directory: ignition/evaluation/ignition-229-r4-runtime-r2-2-codex-native
        run: sha256sum --check SHA256SUMS.txt
      - name: Verify repository path classification
        run: python3 ignition/tools/foundation/validate_repository_path_classification.py --check
      - name: Verify frozen R4 scientific inputs and R1 runtime package unchanged
        run: |
          git diff --exit-code b7267180cb2afe735cdcb0e75583d2e356cadf98 HEAD -- ignition/evaluation/ignition-229-r4-fresh-interface-conformance-r0/
          git diff --exit-code ef819228adf52bd162ba834095fb2489b348cb8e HEAD -- ignition/evaluation/ignition-229-r4-runtime-prereg-r1/
